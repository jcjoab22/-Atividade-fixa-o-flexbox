<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <div class="logo">Logo</div>

            <nav class="menu">
                <a href="#">Link 1</a>
                <a href="#">Link 2</a>
                <a href="#">Link 3</a>
                <a href="#">Link 4</a>
            </nav>

            <button>Botão</button>
        </header>

        <section class="hero">
            <div class="hero-text">
                <h2>Titulo Principal</h2>
                <p>Subtítulo ou linha de texto 1</p>
                <p>Linha de texto 2</p>
                <button>Botão CTA</button>
            </div>

            <div class="hero-image">
                ( ÁREA DE IMAGEM )
            </div>
        </section>

        <main class="main-content">
            <section class="main-section">
                <h3>Seção Principal (3 Cards)</h3>

                <div class="cards">

                    <article class="card">
                        <div class="card-image"> (Imagem 1)</div>
                        <h4>Títullo Card 1</h4>
                        <p>Descrição do Card 1</p>
                        <button>Botão</button>
                    </article>

                    <article class="card">
                        <div class="card-image"> (Imagem 2)</div>
                        <h4>Títullo Card 2</h4>
                        <p>Descrição do Card 2</p>
                        <button>Botão</button>
                    </article>

                    <article class="card">
                        <div class="card-image"> (Imagem 3)</div>
                        <h4>Títullo Card 3</h4>
                        <p>Descrição do Card 3</p>
                        <button>Botão</button>
                    </article>
                    
                </div>
            </section>
        </main>
    </div>
